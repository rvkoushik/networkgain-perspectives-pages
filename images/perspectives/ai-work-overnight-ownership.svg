<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ownership for long-running AI work</title>
  <desc id="desc">A flow from named owner and request, through a completion window and monitored states, to evidence checks and an accountable morning handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#091425"/><stop offset="1" stop-color="#15374e"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#41d8c5"/><stop offset="1" stop-color="#81a7ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020712" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="none" stroke="#7ea2b7" stroke-width="2" opacity=".32"><path d="M0 120H1200M0 270H1200M0 420H1200M0 570H1200"/><path d="M150 0V675M450 0V675M750 0V675M1050 0V675"/></g>
  <text x="70" y="80" fill="#eaf7ff" font-family="Arial, sans-serif" font-size="31" font-weight="700">LONG-RUNNING AI WORK NEEDS A HANDOFF</text>
  <text x="70" y="113" fill="#a8c6d6" font-family="Arial, sans-serif" font-size="18">A completion window is useful only when ownership, evidence and exception rules are clear.</text>
  <g filter="url(#shadow)">
    <rect x="65" y="200" width="220" height="285" rx="20" fill="#10263a" stroke="#4b738d"/>
    <text x="95" y="250" fill="#41d8c5" font-family="Arial, sans-serif" font-size="17" font-weight="700">1 — SUBMIT</text>
    <text x="95" y="301" fill="#f1f8fc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Named owner</text>
    <text x="95" y="337" fill="#c2d8e5" font-family="Arial, sans-serif" font-size="17">Business outcome</text>
    <text x="95" y="370" fill="#c2d8e5" font-family="Arial, sans-serif" font-size="17">Source inputs</text>
    <text x="95" y="403" fill="#c2d8e5" font-family="Arial, sans-serif" font-size="17">Use-by deadline</text>
    <path d="M310 342H370" stroke="url(#line)" stroke-width="6"/><path d="M365 330l22 12-22 12" fill="#81a7ff"/>
    <rect x="400" y="200" width="280" height="285" rx="20" fill="#123f45" stroke="#41d8c5"/>
    <text x="430" y="250" fill="#41d8c5" font-family="Arial, sans-serif" font-size="17" font-weight="700">2 — RUN AND MONITOR</text>
    <text x="430" y="301" fill="#f1f8fc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Completion window</text>
    <text x="430" y="337" fill="#c2e7e4" font-family="Arial, sans-serif" font-size="17">Accepted · running</text>
    <text x="430" y="370" fill="#c2e7e4" font-family="Arial, sans-serif" font-size="17">Waiting · completed</text>
    <text x="430" y="403" fill="#c2e7e4" font-family="Arial, sans-serif" font-size="17">Failed · cancelled</text>
    <path d="M705 342H765" stroke="url(#line)" stroke-width="6"/><path d="M760 330l22 12-22 12" fill="#81a7ff"/>
    <rect x="795" y="200" width="340" height="285" rx="20" fill="#252d55" stroke="#81a7ff"/>
    <text x="825" y="250" fill="#a9c4ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">3 — CHECK AND HAND OFF</text>
    <text x="825" y="301" fill="#f1f8fc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Accepted outcome</text>
    <text x="825" y="337" fill="#d1d9f5" font-family="Arial, sans-serif" font-size="17">Evidence and source checks</text>
    <text x="825" y="370" fill="#d1d9f5" font-family="Arial, sans-serif" font-size="17">Exception route or human review</text>
    <text x="825" y="403" fill="#d1d9f5" font-family="Arial, sans-serif" font-size="17">Action only within authority</text>
  </g>
  <text x="70" y="606" fill="#a8c6d6" font-family="Arial, sans-serif" font-size="18">Do not equate provider completion with business acceptance.</text>
  <text x="70" y="638" fill="#7da5bb" font-family="Arial, sans-serif" font-size="16">NetworkGain analysis • Time, ownership and recovery rules turn delayed AI work into a dependable process.</text>
</svg>
