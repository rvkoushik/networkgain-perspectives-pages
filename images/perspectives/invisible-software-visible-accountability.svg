<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Software can become invisible. Accountability cannot.</title>
  <desc id="desc">A NetworkGain diagram contrasting menu-driven software with an agentic path from intent to outcome, supported by context, authority, evidence and human control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#eee8df"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#24385c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1b2432" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 0H34V900H0Z" fill="#d44535"/>

  <text x="105" y="118" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="3">NETWORKGAIN PERSPECTIVE</text>
  <text x="105" y="200" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700">Software can become invisible.</text>
  <text x="105" y="276" fill="#d44535" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-style="italic">Accountability cannot.</text>

  <g transform="translate(105 358)">
    <text x="0" y="0" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2">THE OLD INTERFACE</text>
    <rect x="0" y="30" width="590" height="225" rx="18" fill="#ffffff" stroke="#d9d3c8" filter="url(#shadow)"/>
    <text x="38" y="84" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">The user translates intent into steps.</text>
    <g transform="translate(38 122)" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="108" height="62" rx="12" fill="#f4f1eb" stroke="#d9d3c8"/><text x="54" y="39" fill="#333b48">Intent</text>
      <path d="M121 31H159" stroke="#9ca3af" stroke-width="2"/><path d="m153 24 8 7-8 7" fill="none" stroke="#9ca3af" stroke-width="2"/>
      <rect x="173" y="0" width="108" height="62" rx="12" fill="#f4f1eb" stroke="#d9d3c8"/><text x="227" y="39" fill="#333b48">Menus</text>
      <path d="M294 31H332" stroke="#9ca3af" stroke-width="2"/><path d="m326 24 8 7-8 7" fill="none" stroke="#9ca3af" stroke-width="2"/>
      <rect x="346" y="0" width="92" height="62" rx="12" fill="#f4f1eb" stroke="#d9d3c8"/><text x="392" y="39" fill="#333b48">Steps</text>
      <path d="M451 31H489" stroke="#9ca3af" stroke-width="2"/><path d="m483 24 8 7-8 7" fill="none" stroke="#9ca3af" stroke-width="2"/>
      <rect x="503" y="0" width="49" height="62" rx="12" fill="#e6e1d8"/><path d="M516 19h23M516 31h23M516 43h15" stroke="#536174" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="38" y="222" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="20">More capability usually meant more interface.</text>
  </g>

  <g transform="translate(800 358)">
    <text x="0" y="0" fill="#d44535" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2">THE AGENTIC INTERFACE</text>
    <rect x="0" y="30" width="695" height="225" rx="18" fill="#ffffff" stroke="#d9d3c8" filter="url(#shadow)"/>
    <text x="38" y="84" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">The system translates intent into an outcome.</text>
    <g transform="translate(38 117)" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="142" height="72" rx="36" fill="#f4f1eb" stroke="#d9d3c8"/><text x="71" y="44" fill="#333b48">Intent</text>
      <path d="M157 36H221" stroke="#d44535" stroke-width="3"/><path d="m214 27 10 9-10 9" fill="none" stroke="#d44535" stroke-width="3"/>
      <rect x="238" y="0" width="170" height="72" rx="36" fill="url(#agent)"/><circle cx="276" cy="36" r="15" fill="#d44535"/><path d="M271 36h10M276 31v10" stroke="#fff" stroke-width="2"/><text x="341" y="44" fill="#ffffff">Agent</text>
      <path d="M425 36H489" stroke="#d44535" stroke-width="3"/><path d="m482 27 10 9-10 9" fill="none" stroke="#d44535" stroke-width="3"/>
      <rect x="506" y="0" width="151" height="72" rx="36" fill="#d44535"/><text x="581" y="44" fill="#ffffff">Outcome</text>
    </g>
    <text x="38" y="222" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="20">Less navigation. More judgment behind the scenes.</text>
  </g>

  <g transform="translate(105 680)">
    <text x="0" y="0" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">When the interface recedes, four controls must become clearer:</text>
    <g transform="translate(0 35)" font-family="Arial, Helvetica, sans-serif">
      <rect x="0" y="0" width="304" height="92" rx="15" fill="#ffffff" stroke="#d9d3c8"/>
      <text x="24" y="38" fill="#d44535" font-size="17" font-weight="700" letter-spacing="1">01  CONTEXT</text>
      <text x="24" y="67" fill="#333b48" font-size="19">What does it know?</text>
      <rect x="326" y="0" width="304" height="92" rx="15" fill="#ffffff" stroke="#d9d3c8"/>
      <text x="350" y="38" fill="#d44535" font-size="17" font-weight="700" letter-spacing="1">02  AUTHORITY</text>
      <text x="350" y="67" fill="#333b48" font-size="19">What may it do?</text>
      <rect x="652" y="0" width="304" height="92" rx="15" fill="#ffffff" stroke="#d9d3c8"/>
      <text x="676" y="38" fill="#d44535" font-size="17" font-weight="700" letter-spacing="1">03  EVIDENCE</text>
      <text x="676" y="67" fill="#333b48" font-size="19">Can we verify it?</text>
      <rect x="978" y="0" width="412" height="92" rx="15" fill="#111827"/>
      <text x="1002" y="38" fill="#f2a79e" font-size="17" font-weight="700" letter-spacing="1">04  HUMAN CONTROL</text>
      <text x="1002" y="67" fill="#ffffff" font-size="19">Can we stop, correct or reverse it?</text>
    </g>
  </g>

  <text x="105" y="862" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="18">Remove effort. Preserve understanding.</text>
  <text x="1495" y="862" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end">© NetworkGain Consulting Commons</text>
</svg>
