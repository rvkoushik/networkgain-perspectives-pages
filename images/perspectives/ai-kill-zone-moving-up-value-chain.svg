<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The AI kill zone is moving up the value chain</title>
  <desc id="desc">A NetworkGain diagram showing AI expanding from task execution through workflow coordination and functional delivery toward advisory work, while durable value moves to context, judgment, accountability and human change.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#eee8df"/>
    </linearGradient>
    <linearGradient id="pressure" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#71251f"/>
      <stop offset=".48" stop-color="#c64536"/>
      <stop offset="1" stop-color="#efaa9f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#161a22" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <path d="M0 0H32V900H0Z" fill="#d44535"/>

  <text x="104" y="104" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">NETWORKGAIN PERSPECTIVE</text>
  <text x="104" y="188" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">The AI kill zone is moving</text>
  <text x="104" y="260" fill="#d44535" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-style="italic">up the value chain.</text>
  <text x="104" y="310" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="24">Not because every firm disappears—but because more of its work can be absorbed.</text>

  <g transform="translate(104 382)">
    <text x="0" y="0" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">THE EXPANDING ZONE OF COMPRESSION</text>

    <g transform="translate(0 35)" filter="url(#shadow)">
      <rect x="0" y="0" width="240" height="258" rx="16" fill="#ffffff" stroke="#d9d3c8"/>
      <rect x="0" y="0" width="240" height="12" rx="6" fill="#e7b2aa"/>
      <text x="24" y="50" fill="#a33b30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">01</text>
      <text x="24" y="91" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">Tasks</text>
      <text x="24" y="132" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Draft</text>
      <text x="24" y="160" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Analyse</text>
      <text x="24" y="188" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Code</text>
      <text x="24" y="216" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Test</text>

      <rect x="258" y="0" width="240" height="258" rx="16" fill="#ffffff" stroke="#d9d3c8"/>
      <rect x="258" y="0" width="240" height="12" rx="6" fill="#dc877b"/>
      <text x="282" y="50" fill="#a33b30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">02</text>
      <text x="282" y="91" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">Workflows</text>
      <text x="282" y="132" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Investigate</text>
      <text x="282" y="160" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Coordinate</text>
      <text x="282" y="188" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Resolve</text>
      <text x="282" y="216" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Document</text>

      <rect x="516" y="0" width="240" height="258" rx="16" fill="#ffffff" stroke="#d9d3c8"/>
      <rect x="516" y="0" width="240" height="12" rx="6" fill="#ce5b4d"/>
      <text x="540" y="50" fill="#a33b30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">03</text>
      <text x="540" y="91" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">Functions</text>
      <text x="540" y="132" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Service desk</text>
      <text x="540" y="160" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Modernisation</text>
      <text x="540" y="188" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Operations</text>
      <text x="540" y="216" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Assurance</text>

      <rect x="774" y="0" width="240" height="258" rx="16" fill="#fff9f8" stroke="#c94c3f" stroke-width="2"/>
      <rect x="774" y="0" width="240" height="12" rx="6" fill="#a82e25"/>
      <text x="798" y="50" fill="#a33b30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">04</text>
      <text x="798" y="91" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">Advisory</text>
      <text x="798" y="132" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Research</text>
      <text x="798" y="160" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Diagnose</text>
      <text x="798" y="188" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Recommend</text>
      <text x="798" y="216" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="19">Orchestrate</text>
    </g>

    <path d="M36 335H975" stroke="url(#pressure)" stroke-width="10" stroke-linecap="round"/>
    <path d="m960 318 27 17-27 17" fill="none" stroke="#a82e25" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="385" fill="#a33b30" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">AI moves from producing artifacts to absorbing delivery.</text>
  </g>

  <g transform="translate(1168 382)">
    <text x="0" y="0" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">DURABLE HUMAN VALUE</text>
    <rect x="0" y="35" width="328" height="362" rx="18" fill="#111827" filter="url(#shadow)"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="30" y="89" fill="#f2a79e" font-size="17" font-weight="700" letter-spacing="1">01  CONTEXT</text>
      <text x="30" y="119" fill="#ffffff" font-size="19">Know what is really true.</text>
      <line x1="30" y1="145" x2="298" y2="145" stroke="#3f4857"/>
      <text x="30" y="185" fill="#f2a79e" font-size="17" font-weight="700" letter-spacing="1">02  JUDGMENT</text>
      <text x="30" y="215" fill="#ffffff" font-size="19">Choose under ambiguity.</text>
      <line x1="30" y1="241" x2="298" y2="241" stroke="#3f4857"/>
      <text x="30" y="281" fill="#f2a79e" font-size="17" font-weight="700" letter-spacing="1">03  ACCOUNTABILITY</text>
      <text x="30" y="311" fill="#ffffff" font-size="19">Own the consequence.</text>
      <line x1="30" y1="337" x2="298" y2="337" stroke="#3f4857"/>
      <text x="30" y="377" fill="#f2a79e" font-size="17" font-weight="700" letter-spacing="1">04  HUMAN CHANGE</text>
    </g>
  </g>

  <rect x="104" y="817" width="1392" height="2" fill="#c9c1b5"/>
  <text x="104" y="858" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">The next to fall will not be the least intelligent. It will be the least differentiated.</text>
  <text x="1496" y="858" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="end">© NetworkGain Consulting Commons</text>
</svg>
