<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From more AI use cases to compounding enterprise value</title>
  <desc id="desc">A hand-drawn NetworkGain whiteboard showing a messy pile of isolated AI use cases being tested through five value questions before becoming reusable capability, changed workflows and measurable outcomes.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="8" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="grey"/><feComponentTransfer in="grey" result="faint"><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer><feBlend in="SourceGraphic" in2="faint" mode="multiply"/></filter>
    <filter id="wobble" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="1" seed="13" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1L10 6L1 11" fill="none" stroke="#2667c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1L10 6L1 11" fill="none" stroke="#17846d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>.hand{font-family:'Comic Sans MS','Bradley Hand','Segoe Print',cursive}.sans{font-family:Inter,Arial,sans-serif}.ink{fill:#17223b}.muted{fill:#5c6473}.blue{fill:#2667c9}.green{fill:#17846d}.red{fill:#c94b3c}.sketch{fill:none;stroke:#27364f;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1600" height="900" fill="#fbfaf4"/><rect x="22" y="22" width="1556" height="856" rx="18" fill="none" stroke="#d8d4c6" stroke-width="2" filter="url(#wobble)"/><rect width="1600" height="900" fill="transparent" filter="url(#paper)"/>
  <g class="sans"><text x="72" y="64" fill="#2667c9" font-size="17" font-weight="800" letter-spacing="2.2">NETWORKGAIN • WORKING WHITEBOARD</text><text x="1528" y="64" fill="#777d87" font-size="15" text-anchor="end">AI PORTFOLIO → VALUE</text></g>
  <g class="hand"><text x="72" y="134" class="ink" font-size="50" font-weight="700">AI use cases grew by more than</text><text x="900" y="134" class="blue" font-size="70" font-weight="700">400%</text><path d="M895 148C965 157 1045 151 1122 145" fill="none" stroke="#2667c9" stroke-width="5" stroke-linecap="round" filter="url(#wobble)"/><text x="72" y="194" class="ink" font-size="44" font-weight="700">But did the enterprise become</text><text x="754" y="194" class="green" font-size="48" font-weight="700">more valuable?</text><path d="M750 207C875 218 1048 215 1188 204" fill="none" stroke="#17846d" stroke-width="4" stroke-linecap="round" filter="url(#wobble)"/></g>
  <path d="M62 230C430 224 820 237 1535 226" fill="none" stroke="#c9c6bb" stroke-width="2" stroke-dasharray="10 12" filter="url(#wobble)"/>

  <g filter="url(#wobble)"><path d="M75 295C144 273 245 278 329 293L316 371C230 365 143 378 83 359Z" fill="#fff0a8" stroke="#d3b13f" stroke-width="2"/><path d="M217 354C294 334 384 343 447 360L437 433C354 424 277 438 215 419Z" fill="#d9ecff" stroke="#79a7d8" stroke-width="2"/><path d="M79 420C144 398 238 404 306 422L298 492C224 486 141 498 84 482Z" fill="#dff4e8" stroke="#78b991" stroke-width="2"/><path d="M240 485C312 465 400 472 459 491L449 562C372 553 303 569 237 550Z" fill="#f4dbe7" stroke="#c68da9" stroke-width="2"/><path d="M89 553C164 535 245 540 325 556L313 627C234 621 151 635 83 618Z" fill="#f8e0c7" stroke="#d49a62" stroke-width="2"/></g>
  <g class="hand ink" font-size="25" font-weight="700" text-anchor="middle"><text x="201" y="328">customer bot</text><text x="201" y="354" font-size="17" font-weight="400">“looks promising”</text><text x="331" y="390">coding copilot</text><text x="331" y="416" font-size="17" font-weight="400">“people like it”</text><text x="191" y="450">forecast model</text><text x="191" y="476" font-size="17" font-weight="400">“pilot complete”</text><text x="349" y="520">service agent</text><text x="349" y="546" font-size="17" font-weight="400">“ready to scale?”</text><text x="202" y="586">HR assistant</text><text x="202" y="612" font-size="17" font-weight="400">“sponsor excited”</text></g>
  <g class="hand"><text x="86" y="675" class="red" font-size="29" font-weight="700">Lots of motion.</text><text x="86" y="710" class="ink" font-size="27" font-weight="700">Little shared learning.</text><path d="M82 722C185 732 300 728 399 719" fill="none" stroke="#c94b3c" stroke-width="3" filter="url(#wobble)"/><text x="89" y="755" class="muted" font-size="19">Each idea rebuilds data, controls,</text><text x="89" y="782" class="muted" font-size="19">integration and support from scratch.</text></g>

  <path d="M472 480C500 467 515 463 544 462" class="sketch" stroke="#2667c9" stroke-width="4" marker-end="url(#arrowBlue)" filter="url(#wobble)"/><text x="507" y="427" class="hand blue" font-size="21" font-weight="700" text-anchor="middle" transform="rotate(-7 507 427)">test the claim</text>
  <g filter="url(#wobble)"><path d="M560 286C689 271 846 274 977 287L953 670C826 683 686 679 588 665Z" fill="none" stroke="#2667c9" stroke-width="4"/><path d="M580 346C690 340 822 342 951 347M585 410C700 404 830 406 956 412M588 475C710 469 832 471 957 477M590 540C712 534 830 537 956 542M592 604C715 599 826 601 952 607" fill="none" stroke="#9dbce7" stroke-width="2" stroke-dasharray="7 9"/></g>
  <g class="hand"><text x="767" y="318" class="blue" font-size="28" font-weight="700" text-anchor="middle">Five questions before “scale”</text>
    <g fill="none" stroke="#2667c9" stroke-width="3" filter="url(#wobble)"><circle cx="620" cy="378" r="18"/><circle cx="620" cy="443" r="18"/><circle cx="620" cy="508" r="18"/><circle cx="620" cy="573" r="18"/><circle cx="620" cy="628" r="18"/></g>
    <g class="blue" font-size="20" font-weight="700" text-anchor="middle"><text x="620" y="386">1</text><text x="620" y="451">2</text><text x="620" y="516">3</text><text x="620" y="581">4</text><text x="620" y="636">5</text></g>
    <g class="ink" font-size="25" font-weight="700"><text x="657" y="385">What consequence changes?</text><text x="657" y="450">What evidence proves it?</text><text x="657" y="515">What can the next team reuse?</text><text x="657" y="580">Do the full economics work?</text><text x="657" y="635">Can we trust it in operation?</text></g>
  </g>
  <path d="M978 480C1016 466 1034 466 1069 470" class="sketch" stroke="#17846d" stroke-width="4" marker-end="url(#arrowGreen)" filter="url(#wobble)"/><text x="1028" y="428" class="hand green" font-size="21" font-weight="700" text-anchor="middle" transform="rotate(7 1028 428)">keep what works</text>

  <g filter="url(#wobble)"><path d="M1080 620L1080 552L1198 552L1198 475L1322 475L1322 389L1500 389" fill="none" stroke="#17846d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1100 627C1202 640 1374 632 1505 619" fill="none" stroke="#c6d5cd" stroke-width="2"/></g>
  <g class="hand ink" font-size="22" font-weight="700"><text x="1092" y="586">shared data +</text><text x="1092" y="612">controls</text><text x="1210" y="510">reusable</text><text x="1210" y="536">capability</text><text x="1337" y="424">changed workflow</text><text x="1337" y="450">+ measurable outcome</text></g>
  <g class="hand"><path d="M1163 326C1258 285 1392 291 1491 329C1509 336 1514 357 1494 367C1391 407 1250 401 1162 363C1143 355 1145 335 1163 326Z" fill="#def3e9" stroke="#17846d" stroke-width="3" filter="url(#wobble)"/><text x="1328" y="349" class="green" font-size="30" font-weight="700" text-anchor="middle">The next win gets easier.</text><text x="1090" y="679" class="green" font-size="30" font-weight="700">This is compounding value.</text><path d="M1087 692C1215 705 1375 702 1504 690" fill="none" stroke="#17846d" stroke-width="4" filter="url(#wobble)"/><text x="1090" y="731" class="muted" font-size="19">Lower time, cost and risk because the</text><text x="1090" y="758" class="muted" font-size="19">enterprise has learned structurally.</text></g>

  <path d="M428 813C655 793 934 799 1177 813L1166 858C918 865 660 862 438 852Z" fill="#fff4bf" stroke="#d0aa31" stroke-width="2" filter="url(#wobble)"/><text x="802" y="842" class="hand ink" font-size="27" font-weight="700" text-anchor="middle">Don’t count the register. Ask what the enterprise can now do repeatedly.</text><text x="1518" y="844" class="sans muted" font-size="14" text-anchor="end">© NetworkGain Consulting Commons</text>
</svg>
